<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Motors</title>

    <!--Imporatações-->
    <script src="./javascript/script.js" defer></script>
    <link rel="stylesheet" href="../css/styleCadastrar.css">
    <link rel="stylesheet" href="../css/styleGlobal.css">

</head>
<body>
    <section>
        <div class="content-section section-cadastro">
            <div class="tela-geral">
                <div class="info-lateral">
                    <img class="logo" src="../img/logo-vm-branco.png" alt="Logo do Vitrine Motors">
                </div>
                
                <div class="cadastro-dados">
                    <p id="titulo-cadastro">Formulário Cadastro Cliente</p>
                    <form action="/Cliente/Cadastrar" method="post">
                        
                        <div class="inputs-gerais">
                            <label for="nomeCompleto">Nome completo</label>
                            <div class="grupo-input">
                                <div class="icone-input">
                                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                                </div>
                                <input type="text" id="nomeCompleto" name="NomeCompleto" placeholder="Seu nome completo" required />
                            </div>
                        </div>

                        <div class="linha-dupla-inputs">
                            <div class="inputs-gerais">
                                <label for="cpf">CPF</label>
                            <div class="grupo-input">
                                <div class="icone-input">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/></svg>
                                </div>
                                <input type="text" id="cpf" name="Cpf" placeholder="000.000.000-00" maxlength="14" required />
                            </div>
                        </div>
                        <div class="inputs-gerais">
                            <label for="telefone">Telefone</label>
                            <div class="grupo-input">
                                <div class="icone-input">
                                    <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 01.22 2.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.13 6.13l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                                </div>
                                <input type="tel" id="telefone" name="Telefone" placeholder="(11) 90000-0000" required />
                            </div>
                        </div>
                    </div>
                    

                    <div class="linha-divisoria"></div>
                    <div class="inputs-gerais">
                            <label for="nomeCompleto">Nome completo</label>
                            <div class="grupo-input">
                                <div class="icone-input">
                                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                                </div>
                                <input type="text" id="nomeCompleto" name="NomeCompleto" placeholder="Seu nome completo" required />
                            </div>
                        </div>

                        <div class="linha-dupla-inputs">
                            <div class="inputs-gerais">
                                <label for="cpf">CPF</label>
                            <div class="grupo-input">
                                <div class="icone-input">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/></svg>
                                </div>
                                <input type="text" id="cpf" name="Cpf" placeholder="000.000.000-00" maxlength="14" required />
                            </div>
                        </div>
                        <div class="inputs-gerais">
                            <label for="telefone">Telefone</label>
                            <div class="grupo-input">
                                <div class="icone-input">
                                    <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 01.22 2.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.13 6.13l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                                </div>
                                <input type="tel" id="telefone" name="Telefone" placeholder="(11) 90000-0000" required />
                            </div>
                        </div>
                    </div>
                    

                    <div class="linha-divisoria"></div>

                    </form>
                </div>
            </div>
        </div>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Motors</title>

    <!--Imporatações-->
    <script src="./javascript/script.js" defer></script>
    <link rel="stylesheet" href="./css/styleIndex.css">
    <link rel="stylesheet" href="./css/styleGlobal.css">

</head>
<body>
    <section id="secao-header">
        <header class="cabecalho content-section">
            <div class="orientacao-logo">
                <img src="./img/logo.png" class="logo">
                    <div>
                        <h3>Vitrine Motors</h3>
                        <p>Encontre o carro perfeito</p>
                    </div>
            </div>
            <nav class="botoes">
                <a id="btn-sobre" onclick="carregarPagina('sobrenos')">Sobre Nós</a>
                <a id="btn-ajuda" onclick="carregarPagina('ajuda')">Ajuda</a>
                <a id="btn-cadastrar" onclick="carregarPagina('cadastrar')">Entrar/Cadastrar</a>
            </nav>
        </header>
    </section>

    <!--Carregando paginas-->
    <div id="conteudo"></div>

    <section id="secao-footer" class="cor_fundo">
        <footer class="content-section rodape">
            <p id="titulo-rodape">Vitrine Motors</p>
            <p id="descricao-rodape">
                Conectamos você diretamente ao dono do carro, facilitando
                a negociação de forma rápida, transparente e sem intermediários.
            </p>
            <div id="orientar-copyright">
                <span>Tel: (11) 4002-8922</span>
                <span>&copy; 2026 - VitrineMotors - <a asp-area="" asp-controller="Home" asp-action="Privacy">Sobre
                    nós</a>
                </span>
            </div>
        </footer>
    </section>
</body>
</html>

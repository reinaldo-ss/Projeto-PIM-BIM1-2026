<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Motors - Login</title>

    <!--Imporatações-->
    <script src="./javascript/script.js" defer></script>
    <link rel="stylesheet" href="../css/styleLogin.css">
    <link rel="stylesheet" href="../css/styleGlobal.css">

</head>
<body>
    <section>
        <div class="content-section section-login">
            <div class="tela-geral">
                <div class="info-lateral">
                    <a id="sair" onclick="carregarPagina('carros')"> < </a>
                    <div id="texto-central">
                        <p id="titulo-logo">Bem Vindo de volta</p>
                        <p>Entre na sua conta para continuar</p>
                    </div>
                </div>
                <div class="login-dados">
                    <p id="titulo-login">Faça seu Login</p>
                    <form action="/Cliente/Login" method="post">
                        
                        <div class="inputs-gerais">
                            <label for="email">E-mail</label>
                            <div class="grupo-input">
                                <svg class="icone-input" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                                <input type="email" id="email" name="Email" placeholder="seuemail@exemplo.com" required />
                            </div>
                        </div>

                        <div class="inputs-gerais">
                            <label for="senha">Senha</label>
                            <div class="grupo-input">
                                <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                                <input type="password" id="senha" name="Senha" placeholder="••••••••" required />
                            </div>
                        </div>

                        <div class="acoes-login">
                            <button type="button" class="botao-voltar" onclick="carregarPagina('carros')">Voltar</button>
                            <button type="submit" class="botao-login cor_fundo">Login</button>
                        </div>
                        
                        <div class="links-rodape-form">
                            <a onclick="carregarPagina('cadastrarCliente')">Criar uma conta</a>
                            <a onclick="carregarPagina('ajuda')">Precisa de ajuda?</a>
                        </div>

                        

                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

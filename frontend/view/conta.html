<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Motors - Minha Conta</title>

    <!--Importações-->
    <script src="./javascript/script.js" defer></script>
    <link rel="stylesheet" href="../css/styleGlobal.css">
    <link rel="stylesheet" href="../css/styleConta.css">

</head>
<body>
    <section>
        <div class="content-section conta-conteudo">

            <!-- Cabeçalho da conta -->
            <div class="conta-cabecalho">
                <div class="conta-identidade">
                    <div class="conta-avatar" id="info-avatar">JS</div>
                    <div>
                        <p class="conta-nome" id="info-nome-header">João Silva</p>
                        <p class="conta-email" id="info-email-header">joao.silva@email.com</p>
                    </div>
                </div>
                <div class="conta-botoes">
                    <button class="btn-conta-alterar" onclick="prepararEdicaoConta()">Alterar</button>
                </div>
            </div>

            <!-- Cartão: Dados pessoais -->
            <div class="conta-card">
                <p class="conta-card-titulo">Dados Pessoais</p>
                <div class="conta-grid">
                    <div class="conta-campo">
                        <label>Nome completo</label>
                        <p id="info-nome">João Silva de Oliveira</p>
                    </div>
                    <div class="conta-campo">
                        <label>CPF</label>
                        <p id="info-cpf">123.456.789-00</p>
                    </div>
                    <div class="conta-campo">
                        <label>Telefone</label>
                        <p id="info-telefone">(11) 98765-4321</p>
                    </div>
                    <div class="conta-campo">
                        <label>E-mail</label>
                        <p id="info-email">joao.silva@email.com</p>
                    </div>
                    <div class="conta-campo">
                        <label>Senha</label>
                        <p>•••••••••</p>
                    </div>
                    <div class="conta-campo">
                        <label>Estado</label>
                        <p id="info-estado">SP</p>
                    </div>
                    <div class="conta-campo">
                        <label>Cidade</label>
                        <p id="info-cidade">São Paulo</p>
                    </div>
                </div>
            </div>

            <!-- Botões finais -->
            <div class="conta-acoes-fim">
                <button class="btn-conta-excluir" onclick="deletarConta()">Excluir minha conta</button>
            </div>

        </div>
    </section>
</body>
</html>

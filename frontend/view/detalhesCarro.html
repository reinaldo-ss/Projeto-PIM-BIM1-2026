<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Motors - Detalhes do Carro</title>

    <!--Importações-->
    <script src="./javascript/script.js" defer></script>
    <link rel="stylesheet" href="../css/styleCarros.css">
    <link rel="stylesheet" href="../css/styleDetalhe.css">
    <link rel="stylesheet" href="../css/styleGlobal.css">

</head>
<body>
    <section>
        <div class="content-section detalhe-container">

            <a class="detalhe-voltar" onclick="carregarPagina('carros')">‹ Voltar</a>

            <div class="detalhe-grid">

                <!-- Coluna esquerda: carrossel de fotos do carro -->
                <div class="detalhe-galeria">
                    <div class="carrossel" id="carrossel">
                        <button class="carrossel-seta carrossel-seta-esq" onclick="moverCarrossel(-1)">‹</button>

                        <div class="carrossel-viewport">
                            <div class="carrossel-trilho" id="carrossel-trilho">
                                <div class="carrossel-slide">
                                    <img src="https://placehold.co/800x500?text=Frente" alt="Frente" id="foto-principal-detalhe">
                                </div>
                                <div class="carrossel-slide">
                                    <img src="https://placehold.co/800x500?text=Traseira" alt="Traseira" id="foto-traseira-detalhe">
                                </div>
                                <div class="carrossel-slide">
                                    <img src="https://placehold.co/800x500?text=Lateral+Direita" alt="Lateral direita" id="foto-lateral-direita-detalhe">
                                </div>
                                <div class="carrossel-slide">
                                    <img src="https://placehold.co/800x500?text=Lateral+Esquerda" alt="Lateral esquerda" id="foto-lateral-esquerda-detalhe">
                                </div>
                            </div>
                        </div>

                        <button class="carrossel-seta carrossel-seta-dir" onclick="moverCarrossel(1)">›</button>

                        <div class="carrossel-indicadores">
                            <span class="indicador ativo" onclick="irParaSlide(0)"></span>
                            <span class="indicador" onclick="irParaSlide(1)"></span>
                            <span class="indicador" onclick="irParaSlide(2)"></span>
                            <span class="indicador" onclick="irParaSlide(3)"></span>
                        </div>
                    </div>
                </div>

                <!-- Coluna direita: informações do carro -->
                <div class="detalhe-info">
                    <p class="detalhe-marca" id="detalhe-marca">Marca</p>
                    <h2 class="detalhe-modelo" id="detalhe-modelo-titulo">Modelo</h2>
                    <p class="detalhe-preco" id="detalhe-preco">R$ 0,00</p>

                    <div class="detalhe-specs">
                        <div class="detalhe-spec">
                            <span class="spec-label">Ano</span>
                            <span class="spec-valor" id="detalhe-ano">0000</span>
                        </div>
                        <div class="detalhe-spec">
                            <span class="spec-label">Cor</span>
                            <span class="spec-valor" id="detalhe-cor">Indefinida</span>
                        </div>
                        <div class="detalhe-spec">
                            <span class="spec-label">Marca</span>
                            <span class="spec-valor" id="detalhe-marca-spec">-</span>
                        </div>
                        <div class="detalhe-spec">
                            <span class="spec-label">Modelo</span>
                            <span class="spec-valor" id="detalhe-modelo-spec">-</span>
                        </div>
                    </div>

                    <div class="detalhe-descricao">
                        <p class="detalhe-subtitulo">Descrição</p>
                        <p class="detalhe-texto" id="detalhe-descricao-texto">
                            Carregando detalhes do veículo...
                        </p>
                    </div>

                    <a class="btn-whatsapp" id="btn-whatsapp-dinamico" href="#" target="_blank" rel="noopener">
                        <span class="whatsapp-icone">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="white" stroke="none">
                                <path d="M20.52 3.48A11.94 11.94 0 0 0 12.02 0C5.4 0 .06 5.34.06 11.96c0 2.11.55 4.17 1.6 5.98L0 24l6.22-1.63a11.9 11.9 0 0 0 5.8 1.48h.01c6.62 0 11.96-5.34 11.96-11.96 0-3.19-1.24-6.19-3.47-8.41zM12.03 21.8h-.01a9.85 9.85 0 0 1-5.02-1.37l-.36-.21-3.7.97.99-3.6-.24-.37a9.83 9.83 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.13 1.03 6.99 2.9a9.8 9.8 0 0 1 2.89 6.98c0 5.45-4.44 9.84-9.92 9.84zm5.42-7.37c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.47-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.47.13-.62.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51l-.57-.01c-.2 0-.52.07-.8.37-.27.3-1.05 1.02-1.05 2.49 0 1.47 1.08 2.9 1.23 3.1.15.2 2.12 3.24 5.13 4.55.72.31 1.27.49 1.71.63.72.23 1.37.2 1.89.12.58-.09 1.76-.72 2-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/>
                            </svg>
                        </span>
                        Agendar test drive pelo WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

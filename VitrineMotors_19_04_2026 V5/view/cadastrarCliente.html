<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Motors - Cadastro Cliente</title>

    <!--Importações-->
    <script src="./javascript/script.js" defer></script>
    <link rel="stylesheet" href="../css/styleCadCliente.css">
    <link rel="stylesheet" href="../css/styleGlobal.css">

</head>
<body>
    <section>
        <div class="content-section section-cadastro">
            <div class="tela-geral">
                <div class="info-lateral">
                    <a id="sair" onclick="carregarPagina('carros')"> < </a>

                    <div id="texto-central">
                        <img class="logo2" src="../img/logo-vm-branco.png" alt="Logo do Vitrine Motors">
                            <div>
                                <p id="titulo-logo">VitrineMotors</p>
                                <p>Encontre o carro perfeito</p>
                            </div>
                    </div>
                </div>
                
                <div class="cadastro-dados">
                    <p id="titulo-cadastro">Formulário Cadastro Cliente</p>
                    <form action="/Cliente/Cadastrar" method="post">
                        <div class="linha-divisoria"></div>

                        <div class="inputs-gerais">
                            <label for="nomeCompleto">Nome completo</label>
                            <div class="grupo-input">
                                <svg class="icone-input" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                                <input type="text" id="nomeCompleto" name="NomeCompleto" placeholder="Seu nome completo" required />
                            </div>
                        </div>

                        <div class="linha-dupla-inputs">
                            <div class="inputs-gerais">
                                <label for="cpf">CPF</label>
                                <div class="grupo-input">
                                    <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/></svg>
                                    <input type="text" id="cpf" name="Cpf" placeholder="000.000.000-00" maxlength="14" required />
                                </div>
                            </div>
                            <div class="inputs-gerais">
                                <label for="telefone">Telefone</label>
                                <div class="grupo-input">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 01.22 2.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.13 6.13l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                                    <input type="tel" id="telefone" name="Telefone" placeholder="(11) 90000-0000" required />
                                </div>
                            </div>
                        </div>
                    
                        <div class="linha-divisoria"></div>

                        <div class="inputs-gerais">
                        <label for="email">E-mail</label>
                        <div class="grupo-input">
                            <svg class="icone-input" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            <input type="email" id="email" name="Email" placeholder="seuemail@exemplo.com" required />
                        </div>
                        </div>

                        <div class="linha-dupla-inputs">
                        <div class="inputs-gerais">
                            <label for="senha">Senha</label>
                            <div class="grupo-input">
                                <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                                <input type="password" id="senha" name="Senha" placeholder="••••••••" required />
                            </div>
                        </div>
                        <div class="inputs-gerais">
                            <label for="confirmarSenha">Confirmar senha</label>
                            <div class="grupo-input">
                                <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                                <input type="password" id="confirmarSenha" name="ConfirmarSenha" placeholder="••••••••" required />
                            </div>
                        </div>
                        </div>
                        
                        <div class="linha-divisoria"></div>

                        <div class="linha-dupla-inputs">
                        <div class="inputs-gerais">
                            <label for="estado">Estado</label>
                            <div class="grupo-input">
                                <svg class="icone-input" viewBox="0 0 24 24"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0112 2a8 8 0 018 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
                                <select id="estado" name="Estado">
                                    <option value="">Selecione</option>
                                    <option value="SP">SP</option>
                                    <option value="RJ">RJ</option>
                                    <option value="MG">MG</option>
                                    <option value="RS">RS</option>
                                    <option value="PR">PR</option>
                                    <option value="BA">BA</option>
                                    <option value="SC">SC</option>
                                    <option value="GO">GO</option>
                                    <option value="PE">PE</option>
                                    <option value="CE">CE</option>
                                </select>                            
                            </div>
                        </div>
                        <div class="inputs-gerais">
                            <label for="cidade">Cidade</label>
                            <div class="grupo-input">
                                <svg class="icone-input" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                                <input type="text" id="cidade" name="Cidade" placeholder="Sua cidade" />
                            </div>
                        </div>
                        </div>

                        <div class="acoes-cliente">
                            <button type="button" class="botao-voltar" onclick="carregarPagina('carros')">Cancelar</button>
                            <button type="submit" class="botao-cadastrar cor_fundo">Criar minha conta</button>
                        </div>
                        
                        <div class="links-rodape-form">
                            <a onclick="carregarPagina('login')">Já tenho uma conta</a>
                            <a onclick="carregarPagina('ajuda')">Precisa de ajuda?</a>
                        </div>

                        <p class="texto-termos">
                            Ao se cadastrar, você concorda com os <a href="#" onclick="mostrarTermos(); return false;">Termos de Uso</a> e a <a href="#" onclick="mostrarTermos(); return false;">Política de Privacidade</a> da Vitrine Motors.
                        </p>

                    </form>
                </div>
                
            </div>
        </div>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Motors - Cadastrar Carro</title>

    <!--Importações-->
    <script src="./javascript/script.js" defer></script>
    <link rel="stylesheet" href="../css/styleCadCarro.css">
    <link rel="stylesheet" href="../css/styleGlobal.css">
    
</head>
<body>
    <section>
        <div class="content-section section-cadastro">
            <div class="tela-geral">
                <div class="info-lateral cor_fundo">
                    <a id="sair" onclick="carregarPagina('admin')"> < </a>

                    <div id="texto-central">
                        <img class="logo2" src="../img/logo-vm-branco.png" alt="Logo do Vitrine Motors">
                            <div>
                                <p id="titulo-logo">VitrineMotors</p>
                                <p>Cadastre o seu carro</p>
                            </div>
                    </div>
                </div>

                <div class="cadastro-dados cadastro-dados-carro">
                    <p id="titulo-cadastro">Formulário Cadastrar Carro</p>

                    <form action="/Carro/Cadastrar" method="post" enctype="multipart/form-data">
                        <div class="linha-divisoria"></div>

                        <p class="secao-subtitulo">Informações do veículo</p>

                        <div class="linha-dupla-inputs">
                            <div class="inputs-gerais">
                                <label for="marca">Marca</label>
                                <div class="grupo-input">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg>
                                    <input type="text" id="marca" name="Marca" placeholder="Ex: Honda, BMW..." required />
                                </div>
                            </div>
                            <div class="inputs-gerais">
                                <label for="modelo">Modelo</label>
                                <div class="grupo-input">
                                    <svg class="icone-input" viewBox="0 0 24 24"><path d="M3 13l2-5a2 2 0 012-1h10a2 2 0 012 1l2 5"/><path d="M3 13h18v5a1 1 0 01-1 1h-2a1 1 0 01-1-1v-1H7v1a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><circle cx="7.5" cy="16.5" r="1"/><circle cx="16.5" cy="16.5" r="1"/></svg>
                                    <input type="text" id="modelo" name="Modelo" placeholder="Ex: Civic, Corolla..." required />
                                </div>
                            </div>
                        </div>

                        <div class="linha-tripla-inputs">
                            <div class="inputs-gerais">
                                <label for="ano">Ano</label>
                                <div class="grupo-input">
                                    <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                    <input type="number" id="ano" name="Ano" placeholder="2024" min="1900" max="2026" required />
                                </div>
                            </div>
                            <div class="inputs-gerais">
                                <label for="cor">Cor</label>
                                <div class="grupo-input">
                                    <svg class="icone-input" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
                                    <input type="text" id="cor" name="Cor" placeholder="Ex: Preto" required />
                                </div>
                            </div>
                            <div class="inputs-gerais">
                                <label for="preco">Preço (R$)</label>
                                <div class="grupo-input">
                                    <svg class="icone-input" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                                    <input type="number" step="0.01" id="preco" name="Preco" placeholder="0,00" required />
                                </div>
                            </div>
                        </div>

                        <div class="inputs-gerais">
                            <label for="chassi">Chassi</label>
                            <div class="grupo-input">
                                <svg class="icone-input" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/></svg>
                                <input type="text" id="chassi" name="Chassi" placeholder="17 caracteres" maxlength="17" required />
                            </div>
                        </div>

                        <div class="inputs-gerais">
                            <label for="descricao">Descrição</label>
                            <div class="grupo-input">
                                <svg class="icone-input" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
                                <textarea id="descricao" name="Descricao" rows="3" placeholder="Descreva o veículo: estado de conservação, revisões, acessórios..."></textarea>
                            </div>
                        </div>

                        <div class="linha-divisoria"></div>

                        <p class="secao-subtitulo">Fotos do veículo</p>

                        <div class="linha-dupla-inputs">
                            <div class="inputs-gerais">
                                <label for="fotoFrente">Frente</label>
                                <label class="upload-foto" for="fotoFrente">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><polyline points="21 17 16 12 5 19"/></svg>
                                    <span>Clique para<br>adicionar foto</span>
                                </label>
                                <input type="file" id="fotoFrente" name="FotoFrente" accept="image/*" hidden />
                            </div>
                            <div class="inputs-gerais">
                                <label for="fotoTraseira">Traseira</label>
                                <label class="upload-foto" for="fotoTraseira">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><polyline points="21 17 16 12 5 19"/></svg>
                                    <span>Clique para<br>adicionar foto</span>
                                </label>
                                <input type="file" id="fotoTraseira" name="FotoTraseira" accept="image/*" hidden />
                            </div>
                        </div>

                        <div class="linha-dupla-inputs">
                            <div class="inputs-gerais">
                                <label for="fotoLatDir">Lateral direita</label>
                                <label class="upload-foto" for="fotoLatDir">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><polyline points="21 17 16 12 5 19"/></svg>
                                    <span>Clique para<br>adicionar foto</span>
                                </label>
                                <input type="file" id="fotoLatDir" name="FotoLateralDireita" accept="image/*" hidden />
                            </div>
                            <div class="inputs-gerais">
                                <label for="fotoLatEsq">Lateral esquerda</label>
                                <label class="upload-foto" for="fotoLatEsq">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><polyline points="21 17 16 12 5 19"/></svg>
                                    <span>Clique para<br>adicionar foto</span>
                                </label>
                                <input type="file" id="fotoLatEsq" name="FotoLateralEsquerda" accept="image/*" hidden />
                            </div>
                        </div>

                        <div class="linha-divisoria"></div>

                        <div class="acoes-carro">
                            <button type="button" class="botao-voltar" onclick="carregarPagina('admin')">Voltar</button>
                            <button type="submit" class="botao-cadastrar cor_fundo">Cadastrar veículo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Motors - Painel Administrador</title>

    <!--Importações-->
    <script src="../javascript/script.js" defer></script>
    <link rel="stylesheet" href="../css/styleGlobal.css">
    <link rel="stylesheet" href="../css/styleAdmin.css">
    
</head>
<body>
    <!-- Cabeçalho do administrador -->
    <section id="secao-header-admin" class="cor_fundo">
        <header class="cabecalho-admin content-section">
            <div class="orientacao-logo-admin">
                <img src="./img/logo-vm-branco.png" class="logo" alt="Logo Vitrine Motors">
                <div>
                    <h3>Vitrine Motors</h3>
                    <p>Painel Administrativo</p>
                </div>
            </div>

            <div class="admin-usuario">
                <div class="admin-identidade">
                    <span class="admin-avatar">A</span>
                    <div class="admin-info">
                        <p class="admin-nome">Administrador</p>
                        <p class="admin-cargo">Acesso total</p>
                    </div>
                </div>
                <button class="btn-sair" onclick="fazerLogout()">Sair</button>
            </div>
        </header>
    </section>

    <!-- Conteúdo principal -->
    <section>
        <div class="content-section admin-conteudo">
            <div class="admin-topo">
                <div>
                    <p class="admin-titulo">Carros cadastrados</p>
                    <p class="admin-subtitulo">Gerencie o catálogo completo de veículos da plataforma</p>
                </div>
            </div>

            <!-- Barra de ações -->
            <div class="admin-acoes">
                <button class="btn-novo-carro" onclick="novoCarro()">+ Novo carro</button>

                <div class="admin-buscar">
                    <input type="text" id="input-buscar-carro" placeholder="Buscar carro..." onkeydown="checarEnter(event)">
                </div>

                <button class="btn-filtros" onclick="realizarPesquisa()">Pesquisar</button>
                <button class="btn-relatorio" onclick="gerarRelatorio()">Gerar relatório</button>
            </div>

            <!-- Tabela de carros -->
            <div class="admin-tabela-wrapper">
                <table class="admin-tabela">
                    <thead>
                        <tr>
                            <th>Imagem</th>
                            <th>Nome do carro</th>
                            <th>Preço</th>
                            <th>Ano</th>
                            <th>Cor</th>
                            <th>Chassi</th>
                            <th>Marca</th>
                            <th class="col-acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela-admin">
                        
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>
</html>
